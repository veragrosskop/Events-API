name: Events-api-CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build . --file Dockerfile --tag events-api:latest

      - name: Run Container
        run: |
          docker run -d -p 5000:5000 --name events-api-container events-api:latest
          sleep 5
          curl http://localhost:5000/api/health || exit 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v

      - name: Stop Container
        if: always()
        run: |
          docker stop events-api-container
          docker rm events-api-container
