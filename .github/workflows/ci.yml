name: Events-api-CI-CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build . --file Dockerfile --tag events-api:latest --platform linux/amd64

      - name: Run Container
        run: |
          docker run -d -p 5000:5000 --name events-api-container events-api:latest
          sleep 5
          curl http://localhost:5000/api/health || exit 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v

      - name: Stop Container
        if: always()
        run: |
          docker stop events-api-container
          docker rm events-api-container

  deploy:
    if: github.event_name == 'push'
    needs: test

    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build . --file Dockerfile --tag events-api:latest --platform linux/amd64

      - name: Tag Docker image
        run: |
          docker tag events-api:latest ${{ secrets.DOCKERHUB_USERNAME }}/events-api:latest
          docker tag events-api:latest ${{ secrets.DOCKERHUB_USERNAME }}/events-api:${{ github.sha }}

      - name: Push to DockerHub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/events-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/events-api:${{ github.sha }}

      - name: Trigger Deploy to Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          
      - name: Wait for deployment
        run: sleep 60

      - name: Smoke test deployed API
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RENDER_BASE_URL }}/api/health")

          echo "Health endpoint returned: $RESPONSE"

          test "$RESPONSE" = "200"